[project]
name = "hotpepper-gourmet"
dynamic = ["version"]
description = "A simple Python client of Hotpepper API"
authors = [{ name = "Miura Kosuke" }]
maintainers = [{ name = "Miura Kosuke" }]
keywords = ["hotpepper", "api", "client"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]
readme = "README.md"
license = { file = "LICENSE.txt" }

requires-python = ">=3.11"

dependencies = ["httpx>=0.28.1", "pydantic>=2.11.9"]

[dependency-groups]
dev = [
    "setuptools-scm>=8.1.0",
    "python-dotenv>=1.0.1",
    "pre-commit>=4.0.1",
    "pydantic>=2.11.9",
    "ty>=0.0.1a21",
    "ruff>=0.13.2",
]
test = [
    "pytest>=8.3.3",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=5.0.0",
    "pytest-html>=4.1.1",
    "pytest-httpx>=0.32.0",
    "pytest-xdist>=3.8.0",
]
doc = [
    "sphinx>=8.0.2",
    "sphinx-fontawesome>=0.0.6",
    "sphinx-rtd-theme>=3.0.2",
    "sphinx-autobuild>=2024.9.19",
    "esbonio>=0.16.5",
    "myst-parser>=4.0.0",
]


# # NOTE readthedocsでビルドする際に必要(pip install .[docs])
# [project.optional-dependencies]
# docs = [
#     "sphinx>=8.0.2",
#     "sphinx-fontawesome>=0.0.6",
#     "sphinx-rtd-theme>=3.0.2",
#     "sphinx-autobuild>=2024.9.19",
#     "esbonio>=0.16.5",
#     "myst-parser>=4.0.0",
# ]

[project.urls]
Repository = "https://github.com/paperlefthand/hotpepper-gourmet"
# Documentation = "https://hotpepper-gourmet.readthedocs.io"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --maxfail=1"
# addopts = "--cov=pygourmet --cov-report html"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
target-version = "py311"

[tool.ruff.lint]
ignore = ["E741"] # 1文字変数を許容

[tool.setuptools_scm]
# NOTE pypiにアップロードする際のtagの命名規則に従うため
# https://setuptools-scm.readthedocs.io/en/latest/extending/
version_scheme = "no-guess-dev"
local_scheme = "no-local-version"

[build-system]
requires = ["setuptools>=64", "setuptools_scm>=8"]
build-backend = "setuptools.build_meta"
