[project]
name = "hotpepper-gourmet"
# NOTE ダミー値. リリース時は CI がタグからバージョンを書き込んでからビルドする (publish.yml / publish-dev.yml)
version = "0.0.0"
description = "A simple Python client of Hotpepper API"
authors = [{ name = "Miura Kosuke" }]
maintainers = [{ name = "Miura Kosuke" }]
keywords = ["hotpepper", "api", "client"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Framework :: Pydantic :: 2",
    "Intended Audience :: Developers",
    "Natural Language :: Japanese",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Internet :: WWW/HTTP",
    "Typing :: Typed",
]
readme = "README.md"
license = "MIT"
license-files = ["LICENSE.txt"]

requires-python = ">=3.12"

dependencies = ["httpx>=0.28.1", "pydantic>=2.12.5"]

[dependency-groups]
dev = [
    "pydantic>=2.12.5",
    "pytest>=9.0.2",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=5.0.0",
    "pytest-html>=4.1.1",
    "pytest-httpx>=0.32.0",
    "pytest-xdist>=3.8.0",
    "python-dotenv>=1.0.1",
    "ty>=0.0.17",
    # NOTE tox はロックファイルを使わないため, ローカルと CI で結果を一致させるよう完全固定する
    "ruff==0.16.10",
    "prek>=0.3.2",
    "pdoc>=16.0.0",
]
test = [
    "pytest>=9.0.2",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=5.0.0",
    "pytest-html>=4.1.1",
    "pytest-httpx>=0.32.0",
    "pytest-xdist>=3.8.0",
]
doc = ["pdoc>=16.0.0"]


[project.urls]
Repository = "https://github.com/paperlefthand/hotpepper-gourmet"
Documentation = "https://paperlefthand.github.io/hotpepper-gourmet/"
Issues = "https://github.com/paperlefthand/hotpepper-gourmet/issues"
Changelog = "https://github.com/paperlefthand/hotpepper-gourmet/releases"

[tool.uv]
exclude-newer = "1 week"
# NOTE uv 0.10 以前は uv_build 0.13 が生成する sdist を展開できず uv build が失敗する
required-version = ">=0.11"

[tool.uv.build-backend]
# 配布名 (hotpepper-gourmet) とモジュール名が異なるため明示する
module-name = "pygourmet"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--maxfail=1 -n auto -q --tb=short --no-header"
asyncio_default_fixture_loop_scope = "function"
markers = [
    "integration: tests that require a real API key and network connection",
]

[tool.ruff]
target-version = "py312"

[tool.ruff.lint]
ignore = ["E741"] # 1文字変数を許容

[build-system]
# NOTE uv 公式の推奨に従い上限を付ける. 新しいマイナー版が出たら上限を引き上げる (MAINTAINING.md)
requires = ["uv_build>=0.13.6,<0.14"]
build-backend = "uv_build"
