; NOTE English only
[tox]
requires = tox>=4.20, tox-uv>=1.28
env_list = lint,format,type,py312,py313,py314

[testenv]
; NOTE Required to skip local-only tests in tox environment
; passenv = GITHUB_ACTIONS
runner = uv-venv-runner
; NOTE uv-venv-lock-runner is not recommended in library development
description = Run tests
dependency_groups = dev, test
commands = pytest -n auto -v --maxfail=1

[testenv:lint]
skip_install = true
dependency_groups = dev
commands = ruff check .

[testenv:format]
skip_install = true
dependency_groups = dev
commands =
    ruff check . --fix
    ruff format .

[testenv:type]
skip_install = true
dependency_groups = dev
commands = ty check src/pygourmet
