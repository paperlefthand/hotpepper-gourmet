# 依存関係と GitHub Actions の更新 PR を週次でまとめて作成する.
# NOTE cooldown は pyproject.toml の [tool.uv] exclude-newer = "3 days" と揃え,
# 公開直後のバージョン (サプライチェーン攻撃のリスクが高い) を避ける.
# 揃っていないと, Dependabot が提案したバージョンを uv がロックできない.
# NOTE cooldown はバージョン更新にのみ適用され, セキュリティ更新には適用されない.
version: 2
updates:
  - package-ecosystem: uv
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: Asia/Tokyo
    cooldown:
      default-days: 3
    groups:
      python-dependencies:
        applies-to: version-updates
        patterns: ["*"]
      python-security:
        applies-to: security-updates
        patterns: ["*"]
    labels: [dependencies]
    commit-message:
      prefix: chore
      include: scope

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: Asia/Tokyo
    cooldown:
      default-days: 3
    groups:
      github-actions:
        applies-to: version-updates
        patterns: ["*"]
      github-actions-security:
        applies-to: security-updates
        patterns: ["*"]
    labels: [dependencies]
    commit-message:
      prefix: ci
      include: scope
