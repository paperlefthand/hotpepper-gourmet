name: verify-lockfile

# .github/workflows/actions.lock がワークフローの uses: と一致しているか,
# ロックしたコミットが参照先のリポジトリに実在するかを検証する.
# uses: を追加・変更したら gh actions-lock を実行し, actions.lock を一緒にコミットすること (MAINTAINING.md).
#
# NOTE リポジトリに変更がない期間でも, 参照先でのタグの付け替えやコミットの消失を
# 検知できるよう, 週次でも実行する. 失敗時の対処は MAINTAINING.md を参照.
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  schedule:
    - cron: "0 0 * * 1" # 毎週月曜 09:00 JST
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # ブランチ保護の必須チェックに指定する
  verify-lockfile:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      # NOTE 拡張のバージョンを上げるときは, ローカルの拡張も同じバージョンに揃える
      - name: Install gh-actions-lock
        run: gh extension install github/gh-actions-lock --pin v0.4.1
      - name: Verify actions.lock
        run: gh actions-lock --verify
