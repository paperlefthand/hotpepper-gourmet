name: ci

on:
  pull_request:
    branches: [dev]
  push:
    branches: [dev]

# 連続して push された場合に古いジョブをキャンセルする
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - name: Install tools
        run: uv tool install tox --with tox-uv
      - name: Run lint / format / type
        run: tox -e lint,format,type

  tests:
    needs: checks
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false # 1つのバージョンが落ちても他を確認できるようにする
      matrix:
        python-version: ["3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          python-version: ${{ matrix.python-version }}
      - name: Install tox
        run: uv tool install tox --with tox-uv
      - name: Run tests
        run: tox -e py${{ matrix.python-version }}
