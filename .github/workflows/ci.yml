name: ci

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  # publish.yml からリリース前のゲートとして呼び出す
  workflow_call:

permissions:
  contents: read

# NOTE uv tool install には pyproject.toml の [tool.uv] が適用されないため, 環境変数でも指定する.
# 値は pyproject.toml の exclude-newer と揃えること
env:
  UV_EXCLUDE_NEWER: "3 days"

# 連続して push された場合に古いジョブをキャンセルする
concurrency:
  group: ${{ github.workflow }}-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v7.6.0
        with:
          enable-cache: true
      - name: Check that uv.lock is up to date
        run: uv lock --check
      - name: Install tools
        run: uv tool install tox --with tox-uv
      - name: Run lint / format / type
        run: tox -e lint,format,type

  tests:
    needs: checks
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false # 1つのバージョンが落ちても他を確認できるようにする
      matrix:
        python-version: ["3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v7.6.0
        with:
          enable-cache: true
          python-version: ${{ matrix.python-version }}
      - name: Install tox
        run: uv tool install tox --with tox-uv
      - name: Run tests
        run: tox -e py${{ matrix.python-version }}

  # ブランチ保護の必須チェックに指定する集約ジョブ.
  # マトリクスの各ジョブ名を個別に必須指定しなくて済むようにする.
  ci-success:
    if: always()
    needs: [checks, tests]
    runs-on: ubuntu-latest
    steps:
      - name: Check results
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: exit 1
