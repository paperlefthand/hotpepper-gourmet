# NOTE ruff のバージョンは pyproject.toml の dev グループで一元管理するため,
# リモートの ruff-pre-commit ではなく uv 環境の ruff を使う
[[repos]]
repo = "local"
hooks = [
    # Run the linter.
    { id = "ruff-check", name = "ruff check", language = "system", entry = "uv run ruff check --fix", types_or = ["python", "pyi"] },
    # Run the formatter (ruff 0.16 以降は Markdown 内のコードブロックも対象).
    { id = "ruff-format", name = "ruff format", language = "system", entry = "uv run ruff format", types_or = ["python", "pyi", "markdown"] },
]
